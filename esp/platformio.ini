[platformio]
default_envs = esp8285

[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m64.ld  ; 1MB: ~470KB sketch max so OTA has room
monitor_speed = 115200
; first flash: Pico running firmware/Serial_port_transmission.uf2, ESP held in download mode
upload_port = /dev/ttyACM1
upload_speed = 115200

[env:ota]
extends = env:esp8285
upload_protocol = espota
upload_port = pico-esp.local
